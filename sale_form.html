{% extends "base.html" %}{% block content %}<h2 class="content-title mb-1">إنشاء فاتورة بيع</h2><p class="muted mb-4">اختر الدواء والكمية وسيتم تحديث المخزون تلقائياً</p><div class="card p-4" style="max-width:650px"><form method="post">{% csrf_token %}<label class="form-label fw-bold">الدواء</label><select class="form-select mb-3" name="medicine" required><option value="">اختر الدواء</option>{% for m in medicines %}<option value="{{ m.pk }}">{{ m.name }} — المتوفر: {{ m.quantity }} — السعر: {{ m.sale_price }}</option>{% endfor %}</select><label class="form-label fw-bold">الكمية</label><input class="form-control mb-4" type="number" name="quantity" min="1" value="1" required><button class="btn btn-primary">إنشاء الفاتورة</button> <a class="btn btn-light" href="{% url 'sales_list' %}">رجوع</a></form></div>{% endblock %}
