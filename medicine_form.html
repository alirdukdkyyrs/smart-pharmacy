{% extends "base.html" %}{% block content %}<div class="mb-4"><h2 class="content-title">{{ title }}</h2><p class="muted">أدخل بيانات الدواء بدقة</p></div><div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label fw-bold">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>{% endfor %}</div><div class="mt-4"><button class="btn btn-primary">حفظ</button> <a class="btn btn-light" href="{% url 'medicine_list' %}">إلغاء</a></div></form></div><style>input,select{width:100%;padding:10px;border:1px solid #d9e2ec;border-radius:8px}</style>{% endblock %}
